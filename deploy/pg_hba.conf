# Dedicated OpenScroll PostgreSQL container only. No database socket is shared
# with the app. Trusted operator backup/restore uses the protected local socket.
local all all trust

# SCRAM login roles can reach only their intended application database over TCP.
# Order matters: reject other database names before the bootstrap fallback.
host openscroll openscroll_app all scram-sha-256
host all openscroll_app all reject
host openscroll openscroll_migrator all scram-sha-256
host all openscroll_migrator all reject

# Existing bootstrap credentials remain usable by trusted maintenance clients.
host all all all scram-sha-256
