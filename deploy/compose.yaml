name: openscroll-production
x-image: &image
  image: ${OPENSCROLL_IMAGE:-openscroll:production}
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
x-runtime-environment: &runtime-environment
    TRUST_PROXY: "1"
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3000"
    PDF_RENDERER_SOCKET: /run/openscroll-renderer/renderer.sock
    DATABASE_URL: postgresql://openscroll_app:${RUNTIME_DB_PASSWORD:?Run db-credentials for existing configuration}@db:5432/openscroll
    APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
    REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
    ACCESS_REQUEST_NOTIFY_EMAIL: ${ACCESS_REQUEST_NOTIFY_EMAIL:-}
    REQUIRE_EMAIL_VERIFICATION: "true"
    AUTHOR_ASSET_LIMIT_MIB: ${AUTHOR_ASSET_LIMIT_MIB:-1024}
    MAIL_MODE: smtp
    MAIL_FROM: ${MAIL_FROM:?Set the sender}
    SMTP_HOST: ${SMTP_HOST:?Set the SMTP host}
    SMTP_PORT: ${SMTP_PORT:-465}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
services:
  db:
    networks: [internal]
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    command: [postgres, -c, hba_file=/etc/postgresql/openscroll-pg-hba.conf]
    restart: unless-stopped
    environment:
      POSTGRES_USER: openscroll
      POSTGRES_DB: openscroll
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate deploy/.env.production first}
    volumes: ["database:/var/lib/postgresql/data", "./pg_hba.conf:/etc/postgresql/openscroll-pg-hba.conf:ro"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U openscroll -d openscroll"]
      interval: 5s
      timeout: 4s
      retries: 20
    logging: *logging
  provision:
    networks: [internal]
    <<: *image
    command: [node, dist/server/src/server/provision.js, --from-env]
    environment:
      PROVISION_DATABASE_URL: postgresql://openscroll:${POSTGRES_PASSWORD:?Generate private configuration first}@db:5432/openscroll
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?Run db-credentials for existing configuration}
      RUNTIME_DB_PASSWORD: ${RUNTIME_DB_PASSWORD:?Run db-credentials for existing configuration}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=32m,mode=1777"]
    depends_on:
      db: {condition: service_healthy}
  migrate:
    networks: [internal]
    <<: *image
    command: [node, dist/server/src/server/migrate.js]
    environment:
      ADMIN_DATABASE_URL: postgresql://openscroll_migrator:${MIGRATOR_DB_PASSWORD:?Run db-credentials for existing configuration}@db:5432/openscroll
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: {condition: service_healthy}
      provision: {condition: service_completed_successfully}
  maintenance:
    networks: [internal]
    <<: *image
    profiles: [operations]
    command: [node, dist/server/src/server/admin.js]
    environment:
      ADMIN_DATABASE_URL: postgresql://openscroll_migrator:${MIGRATOR_DB_PASSWORD:?Run db-credentials for existing configuration}@db:5432/openscroll
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  renderer:
    image: ${OPENSCROLL_RENDERER_IMAGE:-openscroll:renderer}
    # This service deliberately does not inherit the app environment or networks.
    user: "0:1000"
    network_mode: none
    ipc: private
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      PDF_RENDERER_SOCKET: /run/openscroll-renderer/renderer.sock
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
    volumes: ["renderer_socket:/run/openscroll-renderer"]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=256m,mode=1777"]
    shm_size: 256m
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: [CMD, node, -e, "if(!require('fs').statSync(process.env.PDF_RENDERER_SOCKET).isSocket())process.exit(1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 5s
    logging: *logging
  app:
    networks: [edge, internal]
    <<: *image
    environment: *runtime-environment
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,size=256m,mode=1777"]
    volumes: ["renderer_socket:/run/openscroll-renderer:ro"]
    mem_limit: 2g
    pids_limit: 256
    ports: ["127.0.0.1:${APP_PORT:-3100}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      renderer: {condition: service_healthy}
    stop_grace_period: 45s
  edge:
    networks: [edge]
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    profiles: [edge]
    restart: unless-stopped
    environment:
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1,::1},app"
      OPENSCROLL_HOST: ${OPENSCROLL_HOST:?Set the hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact email}
    ports: ["${HTTPS_BIND:-0.0.0.0}:80:80", "${HTTPS_BIND:-0.0.0.0}:443:443"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "certificates:/data", "caddy_config:/config"]
    depends_on:
      app: {condition: service_healthy}
    logging: *logging
networks:
  edge:
  internal:
    internal: true
volumes:
  renderer_socket:
  database:
  certificates:
  caddy_config:
