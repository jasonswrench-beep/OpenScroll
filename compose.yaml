name: openscroll
services:
  db:
    image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
    environment:
      POSTGRES_USER: openscroll
      POSTGRES_PASSWORD: openscroll_dev
      POSTGRES_DB: openscroll
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openscroll -d openscroll"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
