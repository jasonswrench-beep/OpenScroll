name: openscroll
services:
  db:
    image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
    environment:
      POSTGRES_USER: openscroll
      POSTGRES_PASSWORD: openscroll_dev
      POSTGRES_DB: openscroll
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openscroll -d openscroll"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
