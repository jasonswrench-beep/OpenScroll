# Local container workflow. Replace local credentials/settings before deployment.
services:
  provision:
    image: openscroll:foundation
    build: .
    command: [node, dist/server/src/server/provision.js, --from-env]
    environment:
      PROVISION_DATABASE_URL: postgresql://openscroll:openscroll_dev@db:5432/openscroll
      MIGRATOR_DB_PASSWORD: openscroll_migrator_local_dev_password_0123456789
      RUNTIME_DB_PASSWORD: openscroll_runtime_local_dev_password_9876543210
    depends_on:
      db:
        condition: service_healthy
  migrate:
    image: openscroll:foundation
    build: .
    command: ["node", "dist/server/src/server/migrate.js"]
    environment:
      ADMIN_DATABASE_URL: postgresql://openscroll_migrator:openscroll_migrator_local_dev_password_0123456789@db:5432/openscroll
    depends_on:
      db:
        condition: service_healthy
      provision:
        condition: service_completed_successfully
  maintenance:
    image: openscroll:foundation
    profiles: [operations]
    command: [node, dist/server/src/server/admin.js]
    environment:
      ADMIN_DATABASE_URL: postgresql://openscroll_migrator:openscroll_migrator_local_dev_password_0123456789@db:5432/openscroll
  renderer:
    image: openscroll:renderer
    build:
      context: .
      target: renderer
    # This service deliberately does not inherit the app environment or networks.
    user: "0:1000"
    network_mode: none
    ipc: private
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NODE_ENV: production
      PDF_RENDERER_SOCKET: /run/openscroll-renderer/renderer.sock
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      no_proxy: ""
    volumes: ["renderer_socket:/run/openscroll-renderer"]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=256m,mode=1777"]
    shm_size: 256m
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: [CMD, node, -e, "if(!require('fs').statSync(process.env.PDF_RENDERER_SOCKET).isSocket())process.exit(1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    stop_grace_period: 5s
  app:
    image: openscroll:foundation
    build: .
    environment:
      DATABASE_URL: postgresql://openscroll_app:openscroll_runtime_local_dev_password_9876543210@db:5432/openscroll
      APP_ORIGIN: http://127.0.0.1:3000
      ALLOW_INSECURE_LOCAL_HTTP: "true"
      MAIL_MODE: outbox
      MAIL_OUTBOX_DIR: /app/local-mail
      REQUIRE_EMAIL_VERIFICATION: "true"
      PDF_RENDERER_SOCKET: /run/openscroll-renderer/renderer.sock
    volumes:
      - local_mail:/app/local-mail
      - renderer_socket:/run/openscroll-renderer:ro
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,noexec,size=256m,mode=1777"]
    mem_limit: 2g
    pids_limit: 256
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      renderer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  renderer_socket:
  local_mail:
