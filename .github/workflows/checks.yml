name: Project checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
        env:
          POSTGRES_USER: openscroll
          POSTGRES_PASSWORD: openscroll_dev
          POSTGRES_DB: openscroll
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U openscroll -d openscroll" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://openscroll:openscroll_dev@127.0.0.1:5432/openscroll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install PDF inspection tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils fonts-noto-core fonts-noto-cjk
          python3 -m venv .local/pdf-checks
          .local/pdf-checks/bin/pip install pypdf==6.10.0
          echo "$PWD/.local/pdf-checks/bin" >> "$GITHUB_PATH"
          node --input-type=module -e 'import fs from "node:fs"; import {chromium} from "playwright-core"; fs.appendFileSync(process.env.GITHUB_ENV, "PDF_CHROMIUM_EXECUTABLE_PATH="+chromium.executablePath()+"\n")'
      - run: npm run licenses
      - run: npm run schema:check
      - run: npm run build
      - name: Run unit tests with CI reports
        run: |
          mkdir -p .local/test-results
          node --import tsx --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.local/test-results/unit.xml tests/*.test.ts
      - name: Publish unit test summary
        if: always()
        run: python3 tools/report-unit-results.py .local/test-results/unit.xml
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run test:browser
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Build final application image
        run: docker build --pull --tag openscroll:ci .
      - name: Test final image with an isolated database and Chromium
        run: node tools/container-smoke.mjs openscroll:ci
      - name: Scan final image including installed OS and application packages
        run: |
          mkdir -p .local/container-checks
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$PWD/.local/container-checks:/reports" \
            aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
            image --image-src docker --scanners vuln --pkg-types os,library --list-all-pkgs \
            --format json --output /reports/trivy.json --exit-code 0 openscroll:ci
      - name: Report all findings and reject fixable high or critical vulnerabilities
        run: node tools/report-container-scan.mjs .local/container-checks/trivy.json
      - name: Preserve complete final-image vulnerability inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-container-vulnerabilities
          path: .local/container-checks/trivy.json
          if-no-files-found: warn
          retention-days: 14
