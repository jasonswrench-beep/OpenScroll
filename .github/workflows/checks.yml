name: Project checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_USER: openscroll
          POSTGRES_PASSWORD: openscroll_dev
          POSTGRES_DB: openscroll
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U openscroll -d openscroll" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PROVISION_DATABASE_URL: postgresql://openscroll:openscroll_dev@127.0.0.1:5432/openscroll
      ADMIN_DATABASE_URL: postgresql://openscroll_migrator:synthetic-migrator-password-at-least-32-bytes@127.0.0.1:5432/openscroll
      DATABASE_URL: postgresql://openscroll_app:synthetic-runtime-password-at-least-32-bytes@127.0.0.1:5432/openscroll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm ci
      - name: Provision isolated runtime and migrator database roles
        run: printf '%s' '{"runtimePassword":"synthetic-runtime-password-at-least-32-bytes","migratorPassword":"synthetic-migrator-password-at-least-32-bytes"}' | node --import tsx src/server/provision.ts
      - run: npx playwright install --with-deps chromium
      - name: Install PDF inspection tools and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils fonts-noto-core fonts-noto-cjk
          python3 -m venv .local/pdf-checks
          .local/pdf-checks/bin/pip install pypdf==6.10.0
          echo "$PWD/.local/pdf-checks/bin" >> "$GITHUB_PATH"
      - name: Evaluate source with the opt-in Chrome renderer
        run: |
          docker build --pull --target renderer-chrome --build-arg OS_SECURITY_REFRESH="$(date -u +%Y%m%dT%H%M%SZ)" --build-arg ACCEPT_GOOGLE_CHROME_TERMS=true --tag openscroll:renderer-tests .
          echo "Chrome evaluation only: Debian Chromium below 156.0.8078.79 remains blocked; no browser image or cache is published." >> "$GITHUB_STEP_SUMMARY"
          node tools/renderer-test-service.mjs start openscroll:renderer-tests
      - run: npm run licenses
      - run: npm run schema:check
      - run: npm run build
      - name: Run unit tests with CI reports
        run: |
          mkdir -p .local/test-results
          node --import tsx --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=.local/test-results/unit.xml tests/*.test.ts
      - name: Publish unit test summary
        if: always()
        run: python3 tools/report-unit-results.py .local/test-results/unit.xml
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run test:browser
      - name: Remove disposable source-test renderer
        if: always()
        run: node tools/renderer-test-service.mjs stop
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Install disposable deployment rehearsal dependencies
        run: npm ci
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Build final app and opt-in Chrome evaluation images
        id: image
        run: |
          refresh="$(date -u +%Y%m%dT%H%M%SZ)"
          docker build --pull --target runtime --build-arg OS_SECURITY_REFRESH="$refresh" --tag openscroll:ci .
          docker build --pull --target renderer-chrome --build-arg OS_SECURITY_REFRESH="$refresh" --build-arg ACCEPT_GOOGLE_CHROME_TERMS=true --tag openscroll:renderer-ci .
          echo "Chrome evaluation only: Debian Chromium below 156.0.8078.79 remains blocked; no browser image or cache is published." >> "$GITHUB_STEP_SUMMARY"
      - name: Test final image with an isolated database and Chromium
        run: node tools/container-smoke.mjs openscroll:ci openscroll:renderer-ci
      - name: Verify renderer process, credential, network and deadline boundaries
        run: node tools/renderer-isolation-smoke.mjs openscroll:renderer-ci openscroll:ci
      - name: Rehearse production roles, host authentication, backup, restore and HTTPS
        env:
          OPENSCROLL_TEST_IMAGE: openscroll:ci
          OPENSCROLL_TEST_RENDERER_IMAGE: openscroll:renderer-ci
        run: node --import tsx tools/deployment-smoke.ts
      - name: Scan both final images including OS and application packages
        id: scan
        if: always() && steps.image.outcome == 'success'
        run: |
          mkdir -p .local/container-checks
          for component in app renderer; do
            if [ "$component" = app ]; then image=openscroll:ci; else image=openscroll:renderer-ci; fi
            docker run --rm \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume "$PWD/.local/container-checks:/reports" \
              aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --image-src docker --scanners vuln --pkg-types os,library --list-all-pkgs \
              --format json --output "/reports/$component-trivy.json" --exit-code 0 "$image"
          done
      - name: Report all findings and reject fixable high or critical vulnerabilities
        if: always() && steps.scan.outcome == 'success'
        run: |
          app_status=0
          renderer_status=0
          node tools/report-container-scan.mjs .local/container-checks/app-trivy.json || app_status=$?
          node tools/report-container-scan.mjs .local/container-checks/renderer-trivy.json || renderer_status=$?
          [ "$app_status" -eq 0 ] && [ "$renderer_status" -eq 0 ]
      - name: Preserve complete final-image vulnerability inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-container-vulnerabilities
          path: .local/container-checks/*-trivy.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
